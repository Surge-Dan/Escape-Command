<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  
  <defs>
    <!-- 纸张纹理 -->
    <filter id="paperA" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" seed="2" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.91  0 0 0 0 0.85  0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- 水彩晕染 -->
    <filter id="watercolorA" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="5" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 柔和投影 -->
    <filter id="dropShadowA" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="shadow"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 内高光 -->
    <filter id="innerGlowA" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.5"/>
      <feOffset dx="0" dy="-0.5" result="glow"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 水彩边缘不规则 -->
    <filter id="handDrawnA" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="0.8"/>
    </filter>
  </defs>
  
    <!-- 容器底色 -->
    <rect x="2" y="2" width="44" height="44" rx="10" ry="10" fill="#FFF7E0" stroke="#C9B037" stroke-width="1.5"/>
    <!-- 纸张纹理叠加 -->
    <rect x="2" y="2" width="44" height="44" rx="10" ry="10" fill="#E8DFC9" opacity="0.15" filter="url(#paperA)"/>
    <!-- 容器底部阴影 -->
    <ellipse cx="24" cy="44" rx="16" ry="1.5" fill="#000000" opacity="0.06"/>
  <g>
    <g transform="translate(10,38)"><path d="M0,-1.5 L0.4,-0.4 L1.5,0 L0.4,0.4 L0,1.5 L-0.4,0.4 L-1.5,0 L-0.4,-0.4 Z" fill="#DBC664" opacity="0.7"/></g>
    <circle cx="36" cy="36" r="1.2" fill="none" stroke="#A67C52" stroke-width="0.5" opacity="0.5"/>
    <circle cx="40" cy="24" r="1" fill="#8FB5D1" opacity="0.6"/>
  </g>
  <g>
    
    <!-- 地图折叠形状 -->
    <path d="M10,14 L20,12 L28,14 L38,12 L38,34 L28,36 L20,34 L10,36 Z" fill="#FFF5D6" stroke="#D4C9A8" stroke-width="0.8" filter="url(#handDrawn)"/>
    <!-- 折痕 -->
    <line x1="20" y1="12" x2="20" y2="34" stroke="#D4C9A8" stroke-width="0.5" opacity="0.5"/>
    <line x1="28" y1="14" x2="28" y2="36" stroke="#D4C9A8" stroke-width="0.5" opacity="0.5"/>
    <!-- 路径 -->
    <path d="M14,20 Q20,18 24,24 T34,28" fill="none" stroke="#A67C52" stroke-width="0.8" stroke-dasharray="1.5,1" opacity="0.7"/>
    <!-- 定位针 -->
    <g transform="translate(24,18)" filter="url(#dropShadow)">
      <path d="M0,0 C-3,0 -3,-4 0,-4 C3,-4 3,0 0,0 Z" fill="#5CBF9E"/>
      <circle cx="0" cy="-2" r="1" fill="#FFFFFF" opacity="0.8"/>
    </g>
    <!-- 小树 -->
    <circle cx="32" cy="22" r="1.5" fill="#5CBF9E" opacity="0.6"/>
    <rect x="31.5" y="23" width="1" height="2" fill="#A67C52" opacity="0.5"/>
  </g>
</svg>